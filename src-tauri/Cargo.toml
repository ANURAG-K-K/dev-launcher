[package]
name = "multi-repo-launcher"
version = "0.1.0"
description = "Multi-Repo Dev Launcher — discover, configure, and launch multiple dev repositories from one Windows desktop app."
authors = ["Anurag Kaushal"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "multi_repo_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime for process management (ADR-0003 / D2).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
# Rust-owned SQLite access (ADR-0002 / D1). Drizzle intentionally dropped.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "macros", "migrate"] }
# ISO-8601 timestamps stored as TEXT (see data-model).
chrono = { version = "0.4", features = ["serde"] }
# Ergonomic error enums mapped to a serializable AppError at the IPC boundary.
thiserror = "2"

# NOTE (implementation TODO): the Windows Job Object process-tree kill (ADR-0003) will add the
# `windows` crate with Win32 Job Object features here when the process manager is implemented.
